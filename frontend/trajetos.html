<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meus trajetos | MoveLearn</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/config.js" defer></script>
    <script src="js/trajetos.js" defer></script>
</head>

<body>
    <header class="cabecalho">
        <div class="container">
            <h1>MoveLearn</h1>
            <nav aria-label="Menu principal"><a href="index.html">Início</a><a href="trajetos.html"
                    aria-current="page">Trajetos</a><a href="cursos.html">Cursos</a><a href="aula.html">Aulas</a></nav>
        </div>
    </header>
    <main class="container">
        <h2>Meus trajetos</h2>
        <p>Cadastre o tempo do seu deslocamento e quantos minutos pretende estudar.</p>
        <section class="curso">
            <h3 id="titulo-form">Novo trajeto</h3>
            <form id="form-trajeto"><input type="hidden" id="trajeto-id">
                <div class="campos">
                    <div><label for="nome">Nome do trajeto</label><input id="nome" required maxlength="100"
                            placeholder="Ex.: ida ao trabalho"></div>
                    <div><label for="transporte">Transporte</label><select id="transporte" required>
                            <option value="">Selecione</option>
                        </select></div>
                    <div><label for="duracao">Duração (minutos)</label><input id="duracao" type="number" min="1"
                            max="999" required></div>
                    <div><label for="estudo">Tempo de estudo (minutos)</label><input id="estudo" type="number" min="1"
                            max="999" required></div>
                    <div><label for="frequencia">Dias por semana</label><input id="frequencia" type="number" min="1"
                            max="7" required></div>
                </div>
                <div class="acoes"><button type="submit">Salvar trajeto</button><button type="button" id="cancelar"
                        class="secundario" hidden>Cancelar edição</button></div>
            </form>
            <p id="mensagem" role="status" aria-live="polite"></p>
        </section>
        <section>
            <h3>Trajetos cadastrados</h3>
            <div id="lista-trajetos"></div>
        </section>
    </main>
    <footer class="container rodape">
        <p>MoveLearn — Projeto Global Solution FIAP</p>
    </footer>
</body>

</html>
